# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================
#
# 使用方式:
#   全量模式(Web+分析): docker-compose -f ./docker/docker-compose.yml up -d stock
#   定时任务模式:        docker-compose -f ./docker/docker-compose.yml up -d analyzer-a analyzer-h
#   全部启动:            docker-compose -f ./docker/docker-compose.yml up -d

name: daily-stock-analysis
version: '3.8'
x-common: &common
  build:
    context: https://github.com/Rickion/daily_stock_analysis.git
    dockerfile: docker/Dockerfile
  # 三个服务共用同一镜像，仅构建一次：analyzer-a / analyzer-h 复用 stock 的构建产物
  image: daily-stock-analysis:latest
  restart: unless-stopped
  environment:
    - TZ=Asia/Shanghai
    - WEBUI_HOST=0.0.0.0
    - API_PORT=8000
  volumes:
    - /home/opc/stock_analysis/data:/app/data
    - /home/opc/stock_analysis/logs:/app/logs
    - /home/opc/stock_analysis/reports:/app/reports
    - /home/opc/stock_analysis/strategies:/app/strategies:ro
    # Longbridge OAuth token 缓存持久化；entrypoint 会修复容器侧属主权限。
    # 使用前需在宿主机先创建该目录，再放入已授权的 token 缓存。
    - /home/opc/stock_analysis/longbridge_tokens:/home/dsa/.longbridge
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - bridge
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 256M
networks:
  bridge:
    driver: bridge
services:
  # 全量模式：FastAPI Web 服务 + 自动分析（--serve）
  stock:
    <<: *common
    container_name: stock
    command: python main.py --serve --schedule --host 0.0.0.0 --port 8000
    labels:
      - "caddy=stock.darken.cc"
      - "caddy.reverse_proxy=http://localhost:7007"
    ports:
      - "7007:8000"
    environment:
      - STOCK_LIST=${STOCK_LIST}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - LITELLM_MODEL=${LITELLM_MODEL}
      - WECHAT_WEBHOOK_URL=${WECHAT_WEBHOOK_URL}
      - SCHEDULE_ENABLED=${SCHEDULE_ENABLED}
      - SCHEDULE_TIME=${SCHEDULE_TIME}
      - REPORT_TYPE=${REPORT_TYPE}
      - WEBUI_HOST=${WEBUI_HOST}
      - WEBUI_PORT=${WEBUI_PORT}
      - ADMIN_AUTH_ENABLED=${ADMIN_AUTH_ENABLED}
      - MINIMAX_API_KEYS=${MINIMAX_API_KEYS}

  analyzer-a:
    <<: *common
    container_name: stock-analyzer-a
    command: python main.py --schedule
    environment:
      - STOCK_LIST=${STOCK_LIST_A}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - LITELLM_MODEL=${LITELLM_MODEL}
      - WECHAT_WEBHOOK_URL=${WECHAT_WEBHOOK_URL}
      - SCHEDULE_ENABLED=true
      - SCHEDULE_TIME=${SCHEDULE_TIME_A:-18:00}
      - SCHEDULE_RUN_IMMEDIATELY=${SCHEDULE_RUN_IMMEDIATELY:-true}
      - REPORT_TYPE=${REPORT_TYPE:-full}
      - TRADING_DAY_CHECK_ENABLED=${TRADING_DAY_CHECK_ENABLED:-true}
      - MINIMAX_API_KEYS=${MINIMAX_API_KEYS}


  analyzer-h:
    <<: *common
    container_name: stock-analyzer-h
    command: python main.py --schedule
    environment:
      - STOCK_LIST=${STOCK_LIST_H}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - LITELLM_MODEL=${LITELLM_MODEL}
      - WECHAT_WEBHOOK_URL=${WECHAT_WEBHOOK_URL}
      - SCHEDULE_ENABLED=true
      - SCHEDULE_TIME=${SCHEDULE_TIME_H:-18:00}
      - SCHEDULE_RUN_IMMEDIATELY=${SCHEDULE_RUN_IMMEDIATELY:-true}
      - REPORT_TYPE=${REPORT_TYPE:-full}
      - TRADING_DAY_CHECK_ENABLED=${TRADING_DAY_CHECK_ENABLED:-true}
      - MINIMAX_API_KEYS=${MINIMAX_API_KEYS}
