# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================
# 
# 使用方式:
#   定时模式: docker-compose -f ./docker/docker-compose.yml up -d
#   FastAPI模式: docker-compose -f ./docker/docker-compose.yml up -d server
#   同时启动: docker-compose -f ./docker/docker-compose.yml up -d analyzer server

name: daily-stock-analysis
version: '3.8'
x-common: &common
  build:
    context: https://github.com/ZhuLinsen/daily_stock_analysis.git
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  environment:
    - TZ=Asia/Shanghai
    - WEBUI_HOST=0.0.0.0
    - API_PORT=8000
  volumes:
    - /home/opc/stock_analysis/data:/app/data
    - /home/opc/stock_analysis/logs:/app/logs
    - /home/opc/stock_analysis/reports:/app/reports
    - /home/opc/stock_analysis/strategies:/app/strategies:ro
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - bridge
  deploy:
    resources:
      limits:
        memory: 512M
      reservations:
        memory: 256M
networks:
  bridge:
    driver: bridge
services:
  stock:
    <<: *common
    container_name: stock
    command: python main.py --serve-only --host 0.0.0.0 --port 8000
    labels:
      - "caddy=stock.darken.cc"
      - "caddy.reverse_proxy=http://localhost:7007"
    ports:
      - "7007:8000"
    environment:
      - STOCK_LIST=${STOCK_LIST}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - LITELLM_MODEL=${LITELLM_MODEL}
      - WECHAT_WEBHOOK_URL=${WECHAT_WEBHOOK_URL}
      - SCHEDULE_ENABLED=${SCHEDULE_ENABLED}
      - SCHEDULE_TIME=${SCHEDULE_TIME}
      - REPORT_TYPE=${REPORT_TYPE}
      - WEBUI_HOST=${WEBUI_HOST}
      - WEBUI_PORT=${WEBUI_PORT}
      - ADMIN_AUTH_ENABLED=${ADMIN_AUTH_ENABLED}
